<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CastLab</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #msg { position: fixed; left: 24px; bottom: 24px; color: #9a9a9a; font: 18px system-ui, sans-serif; }
</style>
<script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
<video id="v" autoplay playsinline></video>
<video id="a" autoplay playsinline style="position:fixed;width:1px;height:1px;opacity:0"></video>
<div id="msg">CastLab: waiting for the phone…</div>
<script>
// CastLab receiver page. Plays the phone's fragmented MP4 through MediaSource and stays near the live edge.
// The stream URL comes from the phone app (custom message), from ?src=, or is /live.mp4 next to this page
// when the phone itself serves the page. Works in a plain browser too (no Cast framework): open
// http://<phone>:8090/ on the same Wi-Fi.
const NAMESPACE = 'urn:x-cast:com.mashoodhussain.castlab';
const PAGE_VERSION = '2026-10-11c';            // a TV remembers "buffered only" per page version
const BUFFERED_ONLY_KEY = 'castlab-buffered-only';
const video = document.getElementById('v');
const audioEl = document.getElementById('a');
let audioStop = null;           // stops the separate sound stream, when the buffered video stream takes over
let audioStats = {};
const msg = document.getElementById('msg');
const params = new URLSearchParams(location.search);
let context = null;
let started = false;

function say(text) { msg.textContent = text; }
function report(state, extra) {
  if (!context) return;
  try { context.sendCustomMessage(NAMESPACE, undefined, Object.assign({ state }, extra)); } catch (e) {}
}

function play(src) {
  if (started) return;
  started = true;
  say('CastLab: connecting…');
  const ms = new MediaSource();
  video.srcObject = null;                                // a WebRTC stream may have been attached before
  video.autoplay = false;                                // start once a second is buffered, not on the first frame
  video.src = URL.createObjectURL(ms);
  ms.addEventListener('sourceopen', () => {
    const sb = ms.addSourceBuffer('video/mp4; codecs="avc1.640028, mp4a.40.2"');
    const queue = [];
    const pump = () => {
      if (sb.updating || !queue.length) return;
      try { sb.appendBuffer(queue.shift()); } catch (e) { queue.length = 0; }
    };
    sb.addEventListener('updateend', () => {
      pump();
      const b = video.buffered;
      if (video.paused && b.length && b.end(b.length - 1) - Math.max(video.currentTime, b.start(0)) >= 1.0) video.play().catch(() => {});
    });
    sb.addEventListener('error', () => { say('CastLab: decode error'); report('error', { message: 'decode error' }); });
    pull(src + (src.includes('?') ? '&' : '?') + 'audio=1', sb, queue, pump);   // picture and sound
  });
  video.addEventListener('playing', () => { say(''); report('playing'); });
  // Counters sent with the stats, to see what a glitch was: the player ran dry (stall), we skipped a
  // hole (jump) or snapped to the live edge (snap), or the TV's decoder dropped frames.
  let stalls = 0, jumps = 0, snaps = 0;
  video.addEventListener('waiting', () => { stalls++; });
  // Hold about a second behind the live edge: that rides out the Wi-Fi stalls this stream is used for.
  // Jump over holes (frames the phone skipped, reconnects), start where data begins, catch up gently when
  // a stall left us far behind (a visible speed-up at 1.1x was the glitch), snap only when hopelessly far,
  // and trim old data so memory stays flat.
  let tick = 0;
  setInterval(() => {
    const b = video.buffered;
    if (!b.length) return;
    // A hole after a reconnect or a skip: once the player has run into it (stalled, or within 0.3 s of the
    // hole's start), continue from the data after it.
    for (let i = 0; i < b.length - 1; i++) {
      const atHole = video.currentTime >= b.end(i) - 0.3 || video.readyState < 3;
      if (atHole && video.currentTime < b.start(i + 1) && video.currentTime >= b.start(i)) { video.currentTime = b.start(i + 1); jumps++; break; }
    }
    const start = b.start(0);
    const end = b.end(b.length - 1);
    if (video.currentTime < start) video.currentTime = start;
    const behind = end - video.currentTime;
    if (behind > 4) { video.currentTime = end - 1.0; snaps++; }
    video.playbackRate = behind > 1.6 ? 1.05 : 1.0;
    if (++tick % 4 === 0) {                                                     // every 2 s: the phone shows it
      const q = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
      report('stats', { mode: 'buffered', behind: Math.round(behind * 100) / 100, audio: (video.webkitAudioDecodedByteCount || 0) > 0,
                        stalls, jumps, snaps, rate: video.playbackRate,
                        dropped: q ? q.droppedVideoFrames : -1, frames: q ? q.totalVideoFrames : -1 });
    }
    if (video.currentTime - start > 30) {
      try { ms.sourceBuffers[0].remove(start, video.currentTime - 10); } catch (e) {}
    }
  }, 500);
}

// Streams the phone's video into the player and reconnects when the connection drops, for example on a
// Wi-Fi hiccup. A clean end of the stream means the phone stopped mirroring.
function streamEnded() {
  say('CastLab: the phone stopped mirroring');
  report('ended');
  if (context) setTimeout(() => context.stop(), 3000);
}

async function pull(src, sb, queue, pump, stop = { aborted: false }, onEnded = streamEnded) {
  let failures = 0;
  for (;;) {
    if (stop.aborted) return;
    try {
      stop.controller = new AbortController();
      const res = await fetch(src, { cache: 'no-store', signal: stop.controller.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      failures = 0;
      const reader = res.body.getReader();
      for (;;) {
        const { value, done } = await reader.read();
        if (done) { onEnded(); return; }
        queue.push(value);
        pump();
      }
    } catch (e) {
      if (stop.aborted) return;
      if (++failures > 20) {                       // about 10 s of tries: the phone is gone
        say('CastLab: cannot reach the phone (' + e.message + ')');
        report('error', { message: e.message });
        return;
      }
      report('reconnecting', { message: e.message });
      // The new connection starts over with a fresh init segment: drop the cut-off piece of the old one.
      queue.length = 0;
      try { sb.abort(); } catch (err) {}
      await new Promise(resolve => setTimeout(resolve, 500));
    }
  }
}

// The sound, on its own stream next to the WebRTC video. Carried inside WebRTC it shared the phone's Wi-Fi
// queue with the video and arrived in clumps whenever that queue backed up. Here it is AAC in a fragmented
// MP4 over its own connection, played about 0.3 s behind the live edge, so queue hiccups don't reach the ear.
// It plays in a hidden <video> element: this TV's browser never started a plain <audio> element.
// `onStuck` is called if playback still hasn't started 8 s after data arrived.
function playAudioStream(src, onStuck) {
  const a = audioEl;
  const ms = new MediaSource();
  const stop = { aborted: false, controller: null };
  let stalls = 0, sb = null, playError = '', dataSince = 0, mutedTry = false, gaveUp = false;
  a.src = URL.createObjectURL(ms);
  a.addEventListener('waiting', () => { stalls++; });
  const tryPlay = () => {
    if (!a.paused) return;
    a.play().then(() => { if (a.muted) a.muted = false; }).catch(e => { playError = e && e.name ? e.name + ': ' + e.message : String(e); });
  };
  ms.addEventListener('sourceopen', () => {
    try {
      sb = ms.addSourceBuffer('audio/mp4; codecs="mp4a.40.2"');
    } catch (e) {
      playError = 'addSourceBuffer ' + e.name;
      return;
    }
    const queue = [];
    const pump = () => {
      if (sb.updating || !queue.length) return;
      try { sb.appendBuffer(queue.shift()); } catch (e) { queue.length = 0; }
    };
    sb.addEventListener('updateend', () => { pump(); tryPlay(); });
    pull(src, sb, queue, pump, stop, () => {});          // the end of mirroring is announced by the video side
  });
  const timer = setInterval(() => {
    const b = a.buffered;
    const end = b.length ? b.end(b.length - 1) : 0;
    const playing = !a.paused && a.readyState >= 3;
    audioStats = { audio: playing, audioStalls: stalls, audioPaused: a.paused, audioReady: a.readyState,
                   audioT: Math.round(a.currentTime * 100) / 100, audioEnd: Math.round(end * 100) / 100,
                   audioErr: (a.error && a.error.code) || (playError ? playError.slice(0, 60) : 0) };
    if (!b.length) return;
    const start = b.start(0);
    if (a.currentTime < start) a.currentTime = start;
    const behind = end - a.currentTime;
    audioStats.audioBehind = Math.round(behind * 100) / 100;
    if (!playing) {                                     // nothing moves: coax it, then give up on this element
      if (!dataSince) dataSince = Date.now();
      tryPlay();
      const waited = Date.now() - dataSince;
      if (waited > 3000 && a.paused && !mutedTry) { mutedTry = true; a.muted = true; tryPlay(); }   // the autoplay workaround
      // "Playing" yet never past metadata with over a second buffered: this TV's browser won't decode an
      // audio-only stream. Remember that, so the next cast starts in buffered mode without the wait.
      const neverDecodes = !a.paused && a.readyState <= 1 && end - start > 1.0 && waited > 3000;
      if ((neverDecodes || waited > 8000) && !gaveUp) {
        gaveUp = true;
        if (neverDecodes) { try { localStorage.setItem(BUFFERED_ONLY_KEY, PAGE_VERSION); } catch (e) {} }
        if (onStuck) onStuck('the sound player would not start (' + (playError || 'paused ' + a.paused + ', ready ' + a.readyState) + ')');
      }
      return;
    }
    if (behind > 1.0) a.currentTime = end - 0.3;                       // after a stall: snap back near live
    a.playbackRate = behind > 0.4 ? 1.03 : behind < 0.2 ? 0.98 : 1;   // settles ~0.3 s behind; gentle, so the pitch stays steady
    if (a.currentTime - start > 30) { try { sb.remove(start, a.currentTime - 10); } catch (e) {} }
  }, 500);
  audioStop = () => {
    clearInterval(timer);
    stop.aborted = true;
    if (stop.controller) stop.controller.abort();
    a.pause();
    a.removeAttribute('src');
    a.load();
    audioStats = {};
  };
}

// WebRTC: the phone sends the picture as real-time video (UDP, encrypted, as little buffering as the Wi-Fi
// allows). The page makes the offer, POSTs it to the phone's signaling address and gets the answer. The
// sound comes separately (playAudioStream). If WebRTC never connects, the fragmented MP4 stream
// (`fallbackSrc`, picture and sound together) takes over.
async function playWebRTC(signal, fallbackSrc) {
  if (started) return;
  started = true;
  say('CastLab: connecting…');
  playAudioStream(fallbackSrc.replace('live.mp4', 'live.m4a'), why => switchToBuffered(why));
  let pc = null, everConnected = false, failures = 0, retry = null, statsTimer = null, badReports = 0, switched = false;
  const prev = {};
  // The buffered stream holds half a second of picture and sound, so it rides out Wi-Fi stalls that WebRTC
  // can't. Used when WebRTC never connects, drops and won't come back, or runs on a link so bad that the
  // TV has to invent much of the sound or the picture stops. One way: no switching back and forth.
  function switchToBuffered(why) {
    if (switched) return;
    switched = true;
    clearInterval(statsTimer);
    if (retry) { clearTimeout(retry); retry = null; }
    if (pc) { pc.close(); pc = null; }
    if (audioStop) audioStop();                          // the buffered stream carries its own sound
    report('mode', { mode: 'buffered', message: why });
    started = false;
    play(fallbackSrc);
  }
  const reconnect = (why) => {
    if (retry || switched) return;
    if (pc) { pc.close(); pc = null; }
    failures++;
    if (!everConnected && failures >= 3) return switchToBuffered('WebRTC could not connect (' + why + ')');
    if (everConnected && failures >= 3) return switchToBuffered('the WebRTC connection was lost (' + why + ')');
    report('reconnecting', { message: why });
    retry = setTimeout(() => { retry = null; connect(); }, 1000);
  };
  const connect = async () => {
    try {
      const next = new RTCPeerConnection({ iceServers: [] });
      pc = next;
      window.castlabPC = next;                          // for the Mac test tools
      const vt = next.addTransceiver('video', { direction: 'recvonly' });   // video only: sound has its own stream
      try {                                             // H.264 first: the phone encodes it in hardware
        const codecs = RTCRtpReceiver.getCapabilities('video').codecs;
        const rank = c => !/h264/i.test(c.mimeType) ? 2 : /profile-level-id=64/i.test(c.sdpFmtpLine || '') ? 0 : 1;   // High profile first
        vt.setCodecPreferences(codecs.map((c, i) => [c, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]));
      } catch (e) {}
      next.ontrack = (event) => {
        try { event.receiver.jitterBufferTarget = 0; } catch (e) {}     // as little buffering as the network allows
        try { event.receiver.playoutDelayHint = 0; } catch (e) {}
        const stream = event.streams[0] || (video.srcObject instanceof MediaStream ? video.srcObject : new MediaStream());
        if (!stream.getTracks().includes(event.track)) stream.addTrack(event.track);
        if (video.srcObject !== stream) video.srcObject = stream;
        video.play().catch(() => {});
      };
      next.onconnectionstatechange = () => {
        if (pc !== next) return;
        if (next.connectionState === 'connected') { everConnected = true; failures = 0; say(''); report('playing'); }
        if (next.connectionState === 'failed') reconnect('connection failed');
        if (next.connectionState === 'disconnected') setTimeout(() => { if (pc === next && next.connectionState === 'disconnected') reconnect('connection lost'); }, 3000);
      };
      await next.setLocalDescription(await next.createOffer());
      await new Promise(resolve => {                    // all local candidates in the offer: same Wi-Fi, quick
        if (next.iceGatheringState === 'complete') return resolve();
        next.addEventListener('icegatheringstatechange', () => { if (next.iceGatheringState === 'complete') resolve(); });
        setTimeout(resolve, 1500);
      });
      // Tell the phone this TV decodes H.264 up to level 5.1 (the default 3.1 caps the picture at 720p, and the
      // phone then gives up its hardware encoder), and to start at its fixed 3 Mbit/s.
      const offer = next.localDescription.sdp
        .replace(/profile-level-id=([0-9a-f]{4})[0-9a-f]{2}/gi, (m, profile) => 'profile-level-id=' + profile + '33')
        .replace(/(a=fmtp:\d+ [^\r\n]*packetization-mode=1[^\r\n]*)/g, '$1;x-google-start-bitrate=3000');
      const abort = new AbortController();                // the phone answers within ~2 s; don't wait forever
      const timer = setTimeout(() => abort.abort(), 8000);
      const res = await fetch(signal, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: offer, cache: 'no-store', signal: abort.signal });
      clearTimeout(timer);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      await next.setRemoteDescription({ type: 'answer', sdp: await res.text() });
    } catch (e) {
      reconnect(e.message);
    }
  };
  // Every 2 s: how far behind (jitter buffer + half the round trip + decoding), frame rate, freezes, sound.
  // Older browsers (some TVs) lack some of these numbers: each one is sent only when the TV provides it.
  const num = (x) => (typeof x === 'number' && isFinite(x)) ? x : undefined;
  statsTimer = setInterval(async () => {
    if (!pc) return;
    const s = { mode: 'webrtc', connection: pc.connectionState };
    (await pc.getStats()).forEach(r => {
      if (r.type === 'inbound-rtp' && (r.kind || r.mediaType) === 'video') {
        const jbd = num(r.jitterBufferDelay), jbe = num(r.jitterBufferEmittedCount), dec = num(r.totalDecodeTime), fd = num(r.framesDecoded);
        if (jbd !== undefined && jbe !== undefined && prev.jbe !== undefined && jbe > prev.jbe) s.jitterMs = Math.round((jbd - prev.jbd) / (jbe - prev.jbe) * 1000);
        if (dec !== undefined && fd !== undefined && prev.fd !== undefined && fd > prev.fd) s.decodeMs = Math.round((dec - prev.dec) / (fd - prev.fd) * 1000);
        Object.assign(prev, { jbd, jbe, dec, fd });
        Object.assign(s, { fps: num(r.framesPerSecond), frames: fd, dropped: num(r.framesDropped), freezes: num(r.freezeCount),
                           packetsLost: num(r.packetsLost), networkJitterMs: num(r.jitter) !== undefined ? Math.round(r.jitter * 1000) : undefined,
                           width: num(r.frameWidth), height: num(r.frameHeight), decoder: r.decoderImplementation });
      }
      if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded' && num(r.currentRoundTripTime) !== undefined) s.rttMs = Math.round(r.currentRoundTripTime * 1000);
    });
    Object.assign(s, audioStats);                       // the sound stream: playing, how far behind, stalls
    if (s.jitterMs !== undefined) s.behind = Math.round((s.jitterMs + (s.rttMs || 0) / 2 + (s.decodeMs || 0)) / 10) / 100;
    window.castlabStats = s;                            // read by the Mac test tools
    report('stats', s);
    // Link health: a picture that stopped, or sound stalling again and again, for 6 s running means the link
    // stalls for longer than our buffers; the buffered stream copes with that.
    const frozen = s.frames !== undefined && s.frames === prev.lastFrames && pc.connectionState === 'connected';
    prev.lastFrames = s.frames;
    const soundStalled = s.audioStalls !== undefined && s.audioStalls - (prev.audioStalls || 0) >= 2;
    prev.audioStalls = s.audioStalls;
    const bad = frozen || soundStalled;
    badReports = bad ? badReports + 1 : 0;
    if (badReports >= 3) switchToBuffered('weak Wi-Fi: ' + (frozen ? 'the picture stopped' : 'the sound kept stalling'));
  }, 2000);
  connect();
}

function start(data) {
  let bufferedOnly = false;
  try { bufferedOnly = localStorage.getItem(BUFFERED_ONLY_KEY) === PAGE_VERSION; } catch (e) {}
  if (bufferedOnly) {
    report('mode', { mode: 'buffered', message: 'this TV cannot play the separate sound stream (remembered)' });
    play(data.url);
  } else if (data.webrtc && window.RTCPeerConnection) {
    playWebRTC(data.webrtc, data.url);
  } else {
    play(data.url);
  }
}

if (window.cast && cast.framework) {
  try {
    context = cast.framework.CastReceiverContext.getInstance();
    context.addCustomMessageListener(NAMESPACE, event => { if (event.data && event.data.url) start(event.data); });
    context.start({ disableIdleTimeout: true, statusText: 'CastLab' });
  } catch (e) {
    context = null;                                      // not a Cast device: play on our own below
  }
}
const own = new URL('/live.mp4', location.href).href;
if (params.get('webrtc')) start({ webrtc: params.get('webrtc'), url: params.get('src') || own });
else if (params.get('src')) play(params.get('src'));
else if (location.protocol === 'http:') play(own);     // served by the phone: the stream is next door
else if (!context) play(own);                            // plain browser over https: try anyway
</script>
</body>
</html>
